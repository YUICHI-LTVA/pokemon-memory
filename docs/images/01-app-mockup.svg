<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="appbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardback" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#d84343"/>
    </linearGradient>
    <filter id="cs"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="3" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="800" fill="url(#appbg)"/>

  <!-- Header -->
  <text x="360" y="60" text-anchor="middle" font-size="26" font-weight="800" fill="#1f2937">🎴 ポケモン神経衰弱</text>
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#6b7280">同じポケモンのペアを見つけよう！</text>

  <!-- Difficulty pill -->
  <g filter="url(#cs)">
    <rect x="155" y="110" width="410" height="44" rx="22" fill="rgba(255,255,255,0.85)"/>
    <rect x="161" y="116" width="120" height="32" rx="16" fill="#ef5350"/>
    <text x="221" y="138" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">かんたん (6ペア)</text>
    <text x="350" y="138" text-anchor="middle" font-size="12" fill="#374151" font-weight="700">ふつう (10ペア)</text>
    <text x="490" y="138" text-anchor="middle" font-size="12" fill="#374151" font-weight="700">むずかしい (15ペア)</text>
  </g>

  <!-- Stats -->
  <g filter="url(#cs)">
    <rect x="115" y="170" width="380" height="40" rx="20" fill="rgba(255,255,255,0.85)"/>
    <text x="155" y="194" font-size="13" fill="#1f2937" font-weight="600">手数: <tspan fill="#ef5350" font-weight="800">3</tspan></text>
    <text x="225" y="194" font-size="13" fill="#1f2937" font-weight="600">ペア: <tspan fill="#ef5350" font-weight="800">1</tspan>/<tspan fill="#ef5350" font-weight="800">6</tspan></text>
    <text x="305" y="194" font-size="13" fill="#1f2937" font-weight="600">タイム: <tspan fill="#ef5350" font-weight="800">0:24</tspan></text>
    <text x="395" y="194" font-size="13" fill="#1f2937" font-weight="600">お手つき: <tspan fill="#ef5350" font-weight="800">1</tspan></text>
    <rect x="510" y="170" width="90" height="40" rx="20" fill="#ef5350"/>
    <text x="555" y="194" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">リセット</text>
  </g>

  <!-- Penalty banner -->
  <g filter="url(#cs)" transform="translate(180 230)">
    <rect width="360" height="40" rx="20" fill="#fee2e2" stroke="#ef5350" stroke-width="2"/>
    <text x="180" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#ef5350">⛔ お手つき！ <tspan fill="#b91c1c">7</tspan> 秒停止中...</text>
  </g>

  <!-- Board - 4x3 = 12 cards (6 pairs * 2) -->
  <!-- Row 1 -->
  <g filter="url(#cs)" transform="translate(80 300)">
    <!-- Card 1: face down -->
    <g>
      <rect width="130" height="170" rx="14" fill="url(#cardback)"/>
      <rect x="0" y="73" width="130" height="24" fill="#fff"/>
      <circle cx="65" cy="85" r="32" fill="#fff" stroke="#1f2937" stroke-width="5"/>
      <circle cx="65" cy="85" r="22" fill="url(#cardback)"/>
    </g>
    <!-- Card 2: matched (pikachu) -->
    <g transform="translate(150 0)">
      <rect width="130" height="170" rx="14" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
      <text x="65" y="100" text-anchor="middle" font-size="64">⚡</text>
      <text x="65" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">ピカチュウ</text>
    </g>
    <!-- Card 3: matched (pikachu pair) -->
    <g transform="translate(300 0)">
      <rect width="130" height="170" rx="14" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
      <text x="65" y="100" text-anchor="middle" font-size="64">⚡</text>
      <text x="65" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">ピカチュウ</text>
    </g>
    <!-- Card 4: face down -->
    <g transform="translate(450 0)">
      <rect width="130" height="170" rx="14" fill="url(#cardback)"/>
      <rect x="0" y="73" width="130" height="24" fill="#fff"/>
      <circle cx="65" cy="85" r="32" fill="#fff" stroke="#1f2937" stroke-width="5"/>
      <circle cx="65" cy="85" r="22" fill="url(#cardback)"/>
    </g>
  </g>

  <!-- Row 2 -->
  <g filter="url(#cs)" transform="translate(80 490)">
    <!-- Card 5: flipped (Bulbasaur) -->
    <g>
      <rect width="130" height="170" rx="14" fill="#fff"/>
      <text x="65" y="100" text-anchor="middle" font-size="64">🌱</text>
      <text x="65" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">フシギダネ</text>
    </g>
    <!-- Card 6: face down -->
    <g transform="translate(150 0)">
      <rect width="130" height="170" rx="14" fill="url(#cardback)"/>
      <rect x="0" y="73" width="130" height="24" fill="#fff"/>
      <circle cx="65" cy="85" r="32" fill="#fff" stroke="#1f2937" stroke-width="5"/>
      <circle cx="65" cy="85" r="22" fill="url(#cardback)"/>
    </g>
    <!-- Card 7: flipped (Charmander) -->
    <g transform="translate(300 0)">
      <rect width="130" height="170" rx="14" fill="#fff"/>
      <text x="65" y="100" text-anchor="middle" font-size="64">🔥</text>
      <text x="65" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">ヒトカゲ</text>
    </g>
    <!-- Card 8: face down -->
    <g transform="translate(450 0)">
      <rect width="130" height="170" rx="14" fill="url(#cardback)"/>
      <rect x="0" y="73" width="130" height="24" fill="#fff"/>
      <circle cx="65" cy="85" r="32" fill="#fff" stroke="#1f2937" stroke-width="5"/>
      <circle cx="65" cy="85" r="22" fill="url(#cardback)"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="360" y="722" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">完成イメージ：プレイ中の画面</text>
  <text x="360" y="744" text-anchor="middle" font-size="11" fill="#6b7280">黄色背景のカード = ペア成立済み / お手つきバナー = 10秒間ボードが固まる</text>
  <text x="360" y="770" text-anchor="middle" font-size="11" fill="#9ca3af">＊実際にはポケモン公式画像（official-artwork）が表示されます</text>
</svg>
