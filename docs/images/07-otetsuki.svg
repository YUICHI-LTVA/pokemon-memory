<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="sh5"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="460" fill="#fff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">「お手つき」の判定はこうしている</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">めくった2枚の中に「過去に開いたカード」が含まれていたかどうかで判定</text>

  <!-- Case A: brand new -->
  <g filter="url(#sh5)" transform="translate(60 100)">
    <rect width="370" height="320" rx="14" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="185" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#065f46">パターン A：両方とも初めて</text>
    <text x="185" y="60" text-anchor="middle" font-size="11" fill="#374151">→ 普通に裏返るだけ（ペナルティなし）</text>

    <!-- Cards -->
    <g transform="translate(60 90)">
      <rect width="80" height="106" rx="8" fill="#fff" stroke="#10b981" stroke-width="2"/>
      <text x="40" y="54" text-anchor="middle" font-size="32">🐢</text>
      <text x="40" y="82" text-anchor="middle" font-size="10" fill="#374151">ゼニガメ</text>
      <text x="40" y="98" text-anchor="middle" font-size="9" fill="#10b981" font-weight="700">NEW</text>
    </g>
    <g transform="translate(170 90)">
      <rect width="80" height="106" rx="8" fill="#fff" stroke="#10b981" stroke-width="2"/>
      <text x="40" y="54" text-anchor="middle" font-size="32">🦋</text>
      <text x="40" y="82" text-anchor="middle" font-size="10" fill="#374151">バタフリー</text>
      <text x="40" y="98" text-anchor="middle" font-size="9" fill="#10b981" font-weight="700">NEW</text>
    </g>

    <text x="185" y="232" text-anchor="middle" font-size="12" fill="#374151">違うポケモン → 不一致</text>
    <text x="185" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">でも初めて見るカードなので</text>
    <text x="185" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">「覚えてないのは仕方ない」</text>
    <text x="185" y="298" text-anchor="middle" font-size="14" font-weight="800" fill="#10b981">→ ペナルティ無し ✓</text>
  </g>

  <!-- Case B: seen card -->
  <g filter="url(#sh5)" transform="translate(470 100)">
    <rect width="370" height="320" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="185" y="35" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">パターン B：1枚は既出</text>
    <text x="185" y="60" text-anchor="middle" font-size="11" fill="#374151">→ お手つき！10秒停止</text>

    <!-- Cards -->
    <g transform="translate(60 90)">
      <rect width="80" height="106" rx="8" fill="#fff" stroke="#ef4444" stroke-width="2"/>
      <text x="40" y="54" text-anchor="middle" font-size="32">🐢</text>
      <text x="40" y="82" text-anchor="middle" font-size="10" fill="#374151">ゼニガメ</text>
      <text x="40" y="98" text-anchor="middle" font-size="9" fill="#ef4444" font-weight="700">前にも見た</text>
    </g>
    <g transform="translate(170 90)">
      <rect width="80" height="106" rx="8" fill="#fff" stroke="#9ca3af" stroke-width="2"/>
      <text x="40" y="54" text-anchor="middle" font-size="32">🐭</text>
      <text x="40" y="82" text-anchor="middle" font-size="10" fill="#374151">ピカチュウ</text>
      <text x="40" y="98" text-anchor="middle" font-size="9" fill="#6b7280">NEW</text>
    </g>

    <text x="185" y="232" text-anchor="middle" font-size="12" fill="#374151">ゼニガメは前のターンでも開いた</text>
    <text x="185" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">＝ペアの相手を覚えてるはず</text>
    <text x="185" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">なのに違うのを選んだ</text>
    <text x="185" y="298" text-anchor="middle" font-size="14" font-weight="800" fill="#ef4444">→ ⛔ 10秒停止</text>
  </g>

  <text x="450" y="446" text-anchor="middle" font-size="11" fill="#9ca3af">＊一般的な神経衰弱のルール「一度見たカードを間違えたらお手つき」をそのまま実装しています</text>
</svg>
