<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="sh3"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef5350"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">公開までの3ステップ</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">手元のファイル → GitHubに保管 → Vercelで世界公開</text>

  <!-- Step 1 Local -->
  <g filter="url(#sh3)" transform="translate(40 110)">
    <rect width="220" height="200" rx="14" fill="#fff" stroke="#374151" stroke-width="2"/>
    <text x="110" y="35" text-anchor="middle" font-size="32">💻</text>
    <text x="110" y="62" text-anchor="middle" font-size="14" font-weight="800" fill="#1f2937">① 手元（ローカル）</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#374151">あなたのMacの中</text>
    <line x1="20" y1="105" x2="200" y2="105" stroke="#e5e7eb" stroke-width="1"/>
    <text x="110" y="128" text-anchor="middle" font-size="11" fill="#6b7280">📄 index.html</text>
    <text x="110" y="146" text-anchor="middle" font-size="11" fill="#6b7280">📄 README.md</text>
    <text x="110" y="164" text-anchor="middle" font-size="11" fill="#6b7280">📄 .gitignore</text>
    <text x="110" y="190" text-anchor="middle" font-size="10" fill="#9ca3af">→ git でバージョン管理</text>
  </g>

  <line x1="265" y1="210" x2="335" y2="210" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arr3)"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#ef5350" font-weight="700">push</text>
  <text x="300" y="226" text-anchor="middle" font-size="9" fill="#9ca3af">アップロード</text>

  <!-- Step 2 GitHub -->
  <g filter="url(#sh3)" transform="translate(340 110)">
    <rect width="220" height="200" rx="14" fill="#fff" stroke="#0d1117" stroke-width="2"/>
    <text x="110" y="40" text-anchor="middle" font-size="32">🐙</text>
    <text x="110" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117">② GitHub</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#374151">コードの保管庫</text>
    <line x1="20" y1="105" x2="200" y2="105" stroke="#e5e7eb" stroke-width="1"/>
    <text x="110" y="128" text-anchor="middle" font-size="11" fill="#6b7280">📦 リポジトリに保存</text>
    <text x="110" y="146" text-anchor="middle" font-size="11" fill="#6b7280">📅 変更履歴も全部残る</text>
    <text x="110" y="164" text-anchor="middle" font-size="11" fill="#6b7280">🤝 他の人と共有可能</text>
    <text x="110" y="190" text-anchor="middle" font-size="10" fill="#9ca3af">github.com/...</text>
  </g>

  <line x1="565" y1="210" x2="635" y2="210" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arr3)"/>
  <text x="600" y="200" text-anchor="middle" font-size="11" fill="#ef5350" font-weight="700">deploy</text>
  <text x="600" y="226" text-anchor="middle" font-size="9" fill="#9ca3af">公開作業</text>

  <!-- Step 3 Vercel -->
  <g filter="url(#sh3)" transform="translate(640 110)">
    <rect width="220" height="200" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="110" y="40" text-anchor="middle" font-size="28" font-weight="900" fill="#000">▲</text>
    <text x="110" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#000">③ Vercel</text>
    <text x="110" y="92" text-anchor="middle" font-size="11" fill="#374151">公開サーバー</text>
    <line x1="20" y1="105" x2="200" y2="105" stroke="#e5e7eb" stroke-width="1"/>
    <text x="110" y="128" text-anchor="middle" font-size="11" fill="#6b7280">🌍 世界中からアクセス可能</text>
    <text x="110" y="146" text-anchor="middle" font-size="11" fill="#6b7280">🔗 URL自動発行</text>
    <text x="110" y="164" text-anchor="middle" font-size="11" fill="#6b7280">⚡ 高速配信</text>
    <text x="110" y="190" text-anchor="middle" font-size="9" fill="#9ca3af">pokemon-memory-smoky.vercel.app</text>
  </g>

  <text x="450" y="350" text-anchor="middle" font-size="12" fill="#374151">＊今回はコマンド数行（<tspan font-family="monospace" fill="#ef5350">git init</tspan> / <tspan font-family="monospace" fill="#ef5350">gh repo create</tspan> / <tspan font-family="monospace" fill="#ef5350">vercel --prod</tspan>）で完了。AIに丸ごとお願いしました。</text>
</svg>
