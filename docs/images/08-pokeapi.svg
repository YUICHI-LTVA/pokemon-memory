<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <defs>
    <filter id="sh6"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2" result="o"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">PokeAPI ＝ ポケモン情報の自動販売機</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">「No.25のデータちょうだい」と頼むと、画像と名前を返してくれる無料サービス</text>

  <!-- Browser -->
  <g filter="url(#sh6)" transform="translate(60 130)">
    <rect width="240" height="200" rx="14" fill="#fff" stroke="#374151" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" font-size="32">🌐</text>
    <text x="120" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">ブラウザ</text>
    <text x="120" y="85" text-anchor="middle" font-size="11" fill="#6b7280">（あなたの画面）</text>

    <rect x="20" y="100" width="200" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="120" y="124" text-anchor="middle" font-size="11" fill="#1e40af">「No.25 のデータを</text>
    <text x="120" y="140" text-anchor="middle" font-size="11" fill="#1e40af">教えてください」</text>
    <text x="120" y="166" text-anchor="middle" font-size="9" fill="#9ca3af" font-family="monospace">fetch(".../pokemon/25")</text>
  </g>

  <!-- Arrow request -->
  <line x1="305" y1="195" x2="395" y2="195" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr4)"/>
  <text x="350" y="187" text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">リクエスト</text>

  <!-- PokeAPI -->
  <g filter="url(#sh6)" transform="translate(400 130)">
    <rect width="240" height="200" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="35" text-anchor="middle" font-size="32">📦</text>
    <text x="120" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#3b82f6">PokeAPI</text>
    <text x="120" y="85" text-anchor="middle" font-size="11" fill="#6b7280">pokeapi.co</text>

    <rect x="20" y="100" width="200" height="80" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
    <text x="120" y="124" text-anchor="middle" font-size="11" fill="#374151">📚 1025種類分の</text>
    <text x="120" y="140" text-anchor="middle" font-size="11" fill="#374151">ポケモン情報を</text>
    <text x="120" y="156" text-anchor="middle" font-size="11" fill="#374151">全部持っている</text>
    <text x="120" y="172" text-anchor="middle" font-size="9" fill="#10b981">完全無料・登録不要</text>
  </g>

  <!-- Arrow response -->
  <line x1="650" y1="195" x2="740" y2="195" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr4)"/>
  <text x="695" y="187" text-anchor="middle" font-size="11" font-weight="700" fill="#3b82f6">レスポンス</text>

  <!-- Response data -->
  <g filter="url(#sh6)" transform="translate(740 130)">
    <rect width="120" height="200" rx="14" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="40" text-anchor="middle" font-size="32">⚡</text>
    <text x="60" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ピカチュウ</text>
    <text x="60" y="80" text-anchor="middle" font-size="10" fill="#6b7280">No.0025</text>
    <rect x="15" y="92" width="90" height="6" rx="3" fill="#fef3c7"/>
    <text x="60" y="115" text-anchor="middle" font-size="9" fill="#374151">タイプ: でんき</text>
    <text x="60" y="135" text-anchor="middle" font-size="9" fill="#374151">画像URL付き</text>
    <text x="60" y="160" text-anchor="middle" font-size="8" fill="#9ca3af">JSON 形式の</text>
    <text x="60" y="173" text-anchor="middle" font-size="8" fill="#9ca3af">構造化データ</text>
  </g>

  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#374151">＊毎回ランダムな番号（1〜1025）を選んで PokeAPI に問い合わせる仕組み。</text>
  <text x="450" y="400" text-anchor="middle" font-size="11" fill="#9ca3af">画像はポケモン公式の official-artwork、名前は日本語名（ja）を取得しています。</text>
</svg>
