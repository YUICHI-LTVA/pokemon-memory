<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="url(#bg)"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">アプリ全体の構成図</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6b7280">ブラウザを中心に、3つの場所が会話してゲームが動きます</text>

  <!-- Browser (center) -->
  <g filter="url(#shadow)">
    <rect x="320" y="110" width="260" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect x="320" y="110" width="260" height="34" rx="14" fill="#f3f4f6"/>
    <circle cx="338" cy="127" r="5" fill="#ef4444"/>
    <circle cx="354" cy="127" r="5" fill="#f59e0b"/>
    <circle cx="370" cy="127" r="5" fill="#10b981"/>
    <text x="450" y="131" text-anchor="middle" font-size="11" fill="#6b7280">あなたのブラウザ</text>
    <text x="450" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">🎴 ポケモン神経衰弱</text>
    <!-- mock cards grid -->
    <g transform="translate(345 195)">
      <rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/>
      <g transform="translate(54 0)"><rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/></g>
      <g transform="translate(108 0)"><rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/></g>
      <g transform="translate(162 0)"><rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/></g>
      <g transform="translate(0 70)"><rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/></g>
      <g transform="translate(54 70)"><rect width="44" height="58" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="22" y="34" text-anchor="middle" font-size="20">⚡</text></g>
      <g transform="translate(108 70)"><rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/></g>
      <g transform="translate(162 70)"><rect width="44" height="58" rx="6" fill="#ef5350"/><circle cx="22" cy="29" r="10" fill="#fff" stroke="#1f2937" stroke-width="2"/></g>
    </g>
    <text x="450" y="385" text-anchor="middle" font-size="12" fill="#6b7280">画面 ＝ HTML + CSS + JavaScript</text>
  </g>

  <!-- PokeAPI (left) -->
  <g filter="url(#shadow)">
    <rect x="40" y="180" width="200" height="160" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#3b82f6">📦 PokeAPI</text>
    <text x="140" y="232" text-anchor="middle" font-size="11" fill="#374151">ポケモン図鑑の</text>
    <text x="140" y="248" text-anchor="middle" font-size="11" fill="#374151">「自動販売機」</text>
    <text x="140" y="278" text-anchor="middle" font-size="10" fill="#6b7280">名前 / 画像 / タイプを</text>
    <text x="140" y="294" text-anchor="middle" font-size="10" fill="#6b7280">無料で配ってくれる</text>
    <text x="140" y="320" text-anchor="middle" font-size="10" fill="#9ca3af">pokeapi.co</text>
  </g>

  <!-- Vercel (right) -->
  <g filter="url(#shadow)">
    <rect x="660" y="180" width="200" height="160" rx="14" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="760" y="212" text-anchor="middle" font-size="20">▲</text>
    <text x="760" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#000">Vercel</text>
    <text x="760" y="258" text-anchor="middle" font-size="11" fill="#374151">アプリを世界に</text>
    <text x="760" y="274" text-anchor="middle" font-size="11" fill="#374151">公開してくれる場所</text>
    <text x="760" y="300" text-anchor="middle" font-size="10" fill="#6b7280">URLを発行してホスト</text>
    <text x="760" y="318" text-anchor="middle" font-size="10" fill="#9ca3af">pokemon-memory-smoky.vercel.app</text>
  </g>

  <!-- Arrows -->
  <line x1="245" y1="240" x2="315" y2="240" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#6b7280">画像とデータ</text>
  <line x1="315" y1="270" x2="245" y2="270" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#9ca3af">「No.25 ください」</text>

  <line x1="585" y1="240" x2="655" y2="240" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="620" y="232" text-anchor="middle" font-size="11" fill="#6b7280">最初のアクセス</text>
  <line x1="655" y1="270" x2="585" y2="270" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="288" text-anchor="middle" font-size="10" fill="#9ca3af">index.html を配信</text>

  <text x="450" y="465" text-anchor="middle" font-size="13" fill="#374151">🌐 あなた → Vercel から HTML を取得 → ブラウザで動かす → PokeAPI からポケモン情報を取得 → 画面に並べる</text>
  <text x="450" y="487" text-anchor="middle" font-size="11" fill="#9ca3af">＊サーバー側に「自前のプログラム」は無し。すべてブラウザの中で完結する仕組みです</text>
</svg>
